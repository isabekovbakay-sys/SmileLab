name: Android APK

# Собирает ДЕМО-APK (EXPO_PUBLIC_DEMO=1, отладочный ключ) — показать приложение владельцу.
# Релиз для пациентов и Google Play собирается только через EAS: bash scripts/build-apk.sh apk|production.

on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']

# Публикация APK в GitHub Releases.
permissions:
  contents: write

# Сборки одной ветки идут по очереди и не отменяют друг друга
# (иначе перезапуск старого запуска обрывает свежую сборку).
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Пакет «tools» убран из новых cmdline-tools — указываем список явно.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4

      - name: Установка зависимостей
        run: npm ci

      - name: Проверки (типы, линтер, тесты)
        run: npm run check

      - name: В релизном бандле нет демо-данных
        run: npm run bundle:check

      - name: Нативный проект Android
        run: npx expo prebuild --platform android --clean --no-install
        env:
          EXPO_PUBLIC_DEMO: '1'

      - name: Сборка демо-APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
        env:
          EXPO_PUBLIC_DEMO: '1'

      - name: Разрешения в APK — только INTERNET и VIBRATE
        run: |
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$AAPT2" dump permissions "$APK" | tee permissions.txt
          EXTRA=$(grep -oE "name='[^']+'" permissions.txt | grep -vE "INTERNET|VIBRATE|DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION" || true)
          if [ -n "$EXTRA" ]; then echo "Лишние разрешения: $EXTRA"; exit 1; fi
          "$AAPT2" dump xmltree --file AndroidManifest.xml "$APK" > manifest.txt
          if grep -qE "FullscreenPlayerActivity|expo.modules.updates" manifest.txt; then
            echo "В манифесте остались видеоплеер или expo-updates"; exit 1
          fi
          cp "$APK" SmileLab.apk
          SIZE=$(du -b SmileLab.apk | cut -f1)
          echo "Размер APK: $SIZE байт ($(awk "BEGIN {printf \"%.1f\", $SIZE/1048576}") МБ)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Выгрузка APK (артефакт запуска)
        uses: actions/upload-artifact@v4
        with:
          name: smilelab-apk
          path: SmileLab.apk
          if-no-files-found: error

      # Постоянная ссылка на последнюю сборку:
      # https://github.com/<owner>/<repo>/releases/latest/download/SmileLab.apk
      - name: Публикация в GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: SmileLab ДЕМО (сборка ${{ github.run_number }}) — отладочный ключ, не для пациентов
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: SmileLab.apk
          body: |
            ДЕМО-сборка SmileLab: примерные услуги, цены, врачи и часы работы, плашка «Демо».
            Подписана отладочным ключом — только для показа, не для пациентов и не для Google Play.
            Релиз собирается через EAS (bash scripts/build-apk.sh apk|production) после заполнения src/config/clinic.ts.
            Ветка: ${{ github.ref_name }}, коммит: ${{ github.sha }}.
            Установка: откройте файл на телефоне → разрешите установку из этого источника → если Play Защита предупредит, «Подробнее → Всё равно установить».
